version: '3.8'

services:
  # ==========================================
  # PROXY 1: PgBouncer (atrás de HAProxy)
  # ==========================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tcc-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"  # exposto direto também, útil pra debug/comparação isolada
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - benchmark-net

  haproxy:
    image: haproxy:2.9-alpine
    container_name: tcc-haproxy
    restart: unless-stopped
    ports:
      - "6433:6433"  # tráfego Postgres, encaminhado ao PgBouncer
      - "8404:8404"  # painel de estatísticas (http://<VM02_IP>:8404/stats)
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pgbouncer
    networks:
      - benchmark-net

  # ==========================================
  # PROXY 2: ProxySQL
  # ==========================================
  proxysql:
    image: proxysql/proxysql:3.0.4
    container_name: tcc-proxysql
    restart: unless-stopped
    command: proxysql -f -c /etc/proxysql.cnf --initial
    ports:
      - "6033:6033" # Tráfego SQL (Postgres)
      - "6032:6032" # Admin CLI
    volumes:
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
      - proxysql-data:/var/lib/proxysql
    networks:
      - benchmark-net

  # ==========================================
  # PROXY 3: Open-J-Proxy (OJP)
  # ==========================================
  open-j-proxy:
    image: rrobetti/ojp:0.5.4-beta
    container_name: tcc-ojp
    restart: unless-stopped
    ports:
      - "1059:1059" # gRPC
    volumes:
      - ./ojp-libs:/opt/ojp/ojp-libs
    networks:
      - benchmark-net

networks:
  benchmark-net:
    driver: bridge

volumes:
  proxysql-data:
