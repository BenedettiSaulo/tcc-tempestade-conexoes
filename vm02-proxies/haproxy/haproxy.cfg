global
    maxconn 5000
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Balanceamento simples de conexões TCP - o protocolo de wire do
    # Postgres/PgBouncer não passa por aqui, é so encaminhado como bytes.

# Página de estatísticas do HAProxy (opcional, útil pra conferir que
# as conexões estão realmente passando por ele durante o teste)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s

frontend pg_front
    bind *:6433
    default_backend pgbouncer_back

backend pgbouncer_back
    # tcp-check só confirma que a porta está de pé; não valida credenciais
    # nem faz handshake do protocolo Postgres (isso quem faz é o PgBouncer).
    option tcp-check
    tcp-check connect port 6432

    # Hoje só existe uma instância de PgBouncer. Se no futuro você subir
    # mais de uma (para simular alta disponibilidade de verdade), basta
    # adicionar mais linhas "server" aqui - o HAProxy já faz round-robin
    # e tira do balanceamento quem falhar no check.
    server pgbouncer1 pgbouncer:6432 check inter 3s fall 3 rise 2
